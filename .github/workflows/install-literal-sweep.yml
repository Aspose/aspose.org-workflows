# install-literal-sweep.yml
#
# LOCATION: Aspose/aspose.org-workflows  (NOT in Aspose/aspose.org)
#
# MT069-2026-09-16-GHA-MINUTES-REARCHITECTURE, PHB-06 (2026-09-17): sixth
# live migration. The private original ("Install Defect Sweep" -- see its
# own header for the filename-vs-name.yml history) auto-commits its durable
# sweep report via git_plumb_commit.py. Per explicit user decision
# (2026-09-17), this migrated copy opens a PR instead
# (peter-evans/create-pull-request@v6) for that report commit. The actual
# sweep/staleness-check logic is UNCHANGED. `sync_tracked_issues.py` needed
# NO redesign -- it already defaults to `--owner Aspose --repo aspose.org`
# and reads GH_TOKEN from env, so it already targets the private repo
# correctly regardless of which repo invokes it; only the token source
# changed (REPO_TOKEN/GH_TOKEN instead of the ambient GITHUB_TOKEN, which
# would only have worked against aspose.org-workflows itself).
#
# IMPORTANT (human-authority boundary, inherited repo-wide norm, MT062/MT066):
# this workflow (and no automated process) may ever merge the PR it opens.
#
# Required secrets (set in Aspose/aspose.org-workflows, same ones the SEO
# templates and the other migrated bots already use -- not new exposure):
#   REPO_TOKEN   - PAT with repo (full) scope on Aspose/aspose.org -- PRIMARY.
#   GH_TOKEN     - same-shaped PAT, used only as a fallback if REPO_TOKEN is unset.

name: Install Defect Sweep (durability)

on:
  schedule:
    - cron: '0 11 * * 1'  # weekly, Monday 11:00 UTC -- matches the private original's cadence
  workflow_dispatch: {}

jobs:
  defect-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify GitHub token is valid
        id: token_check
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither REPO_TOKEN nor GH_TOKEN secret is set in Aspose/aspose.org-workflows. Add one under Settings -> Secrets -> Actions."
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! WHOAMI=$(gh api user --jq .login 2>&1); then
            echo "::error::GitHub token (REPO_TOKEN/GH_TOKEN) is set but rejected by the GitHub API -- almost certainly expired or revoked. Real error: $WHOAMI"
            echo "reason=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Token OK -- authenticated as $WHOAMI"

      - uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.org
          token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/pipeline/requirements-ci.txt

      - name: Set up venv
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install -r scripts/pipeline/requirements-ci.txt --quiet

      - name: Run combined defect sweep (literal text + install_recipe safety checks)
        id: sweep
        run: |
          mkdir -p reports/audit/install-defect-sweep-latest
          set +e
          PYTHONPATH=scripts/pipeline python -m commands.ops.install_defect_sweep \
            --report-dir reports/audit/install-defect-sweep-latest \
            --issues-out /tmp/findings.json \
            | tee /tmp/sweep-stdout.txt
          echo "sweep_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          report_json=$(grep '^report_json=' /tmp/sweep-stdout.txt | cut -d= -f2-)
          report_md=$(grep '^report_md=' /tmp/sweep-stdout.txt | cut -d= -f2-)
          echo "report_json=$report_json" >> "$GITHUB_OUTPUT"
          echo "report_md=$report_md" >> "$GITHUB_OUTPUT"

      - name: Check content-healing staleness (advisory, never fails the run)
        if: always()
        run: |
          PYTHONPATH=scripts/pipeline python scripts/ci/checks/check_package_content_healing_staleness.py || true

      - name: Sync tracked issues (dedup by family/platform/defect_class) (on the private Aspose/aspose.org repo, its own default)
        if: always() && hashFiles('/tmp/findings.json') != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          PYTHONPATH=scripts/pipeline python -m commands.ops.sync_tracked_issues --findings /tmp/findings.json

      - name: Open a PR with the durable sweep report (instead of committing directly)
        if: always() && steps.sweep.outputs.report_json != ''
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
          title: 'chore(reports): install-defect-sweep report [migrated public execution]'
          body: |
            ## Install Defect Sweep Report

            Weekly literal-install-command + `install_recipe.py` safety-check sweep,
            generated by `install_defect_sweep.py`.

            Generated by `install-literal-sweep.yml` running in
            `Aspose/aspose.org-workflows` (migrated public execution -- MT069 PHB-06).
            This workflow never merges its own PR -- a human review is required.
          branch: automated/install-defect-sweep-report
          commit-message: 'chore(reports): install-defect-sweep report'
          add-paths: |
            ${{ steps.sweep.outputs.report_json }}
            ${{ steps.sweep.outputs.report_md }}

      - name: Open or update a tracking issue if this run itself failed (on this repo, matching SEO-template convention)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh label create install-literal-sweep-failure --repo Aspose/aspose.org-workflows \
            --color d73a4a --description "install-literal-sweep.yml run failed" 2>/dev/null || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON="${{ steps.token_check.outputs.reason || 'see run log' }}"
          BODY=$(cat <<EOF
          Run failed: $RUN_URL
          Trigger: ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Likely cause: $REASON
          EOF
          )
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label install-literal-sweep-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows --body "$BODY"
          else
            gh issue create --repo Aspose/aspose.org-workflows \
              --title "install-literal-sweep.yml is failing" \
              --label install-literal-sweep-failure \
              --body "$BODY"
          fi

      - name: Close the failure-tracking issue if this run succeeded
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label install-literal-sweep-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows \
              --body "Resolved -- this run (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) completed successfully."
            gh issue close "$EXISTING" --repo Aspose/aspose.org-workflows
          fi
