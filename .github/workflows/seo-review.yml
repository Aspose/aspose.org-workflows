# seo-review.yml
#
# LOCATION: Aspose/aspose.org-workflows  (NOT in Aspose/aspose.org)
#
# "PR Arbiter": an automated LLM-based PR reviewer for aspose.org, manually
# dispatched. Predates this mission's own governed S-116 (seo-review skill)
# and is not coordinated with it (Finding #15) -- slated for eventual
# retirement via SEO-EXTERNAL-WORKFLOWS-RETIRE-PR once that task's own
# count-gate clears. Kept working in the meantime rather than left broken,
# since retirement hasn't happened yet.
#
# Required secrets (set in Aspose/aspose.org-workflows):
#   REPO_TOKEN         - PAT with repo (full) scope on Aspose/aspose.org -- PRIMARY.
#   GH_TOKEN           - same-shaped PAT, used only as a fallback if REPO_TOKEN is unset.
#                        Fixed 2026-08-26 alongside this workflow's 2 siblings: identical
#                        GH_TOKEN-primary `||` bug (GH_TOKEN expired 2026-03-23). Hadn't
#                        been dispatched since 2026-04-17 so it never visibly failed, but
#                        carried the same latent defect. Flipped to REPO_TOKEN-primary,
#                        plus the same pre-flight check and failure-notification pattern.
#   GPT_OSS_ENDPOINT   - unrelated to the token fix; used by scripts/arbiter itself.
#   GPT_OSS_API_KEY    - unrelated to the token fix; used by scripts/arbiter itself.
#
# To trigger manually:
#   Aspose/aspose.org-workflows -> Actions -> SEO PR Review -> Run workflow

name: SEO PR Review

on:
  workflow_dispatch:
    inputs:
      max_prs:
        description: "Max PRs to review"
        default: "1"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts/arbiter

    env:
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
      GPT_OSS_ENDPOINT: ${{ secrets.GPT_OSS_ENDPOINT }}
      GPT_OSS_API_KEY: ${{ secrets.GPT_OSS_API_KEY }}

    steps:
      - name: Verify GitHub token is valid
        # See seo-keyword-refresh.yml's identical step for the full rationale.
        # working-directory overridden to the repo root: this job's default
        # (scripts/arbiter) doesn't exist yet -- checkout hasn't run -- and
        # this check has nothing to do with that directory anyway.
        id: token_check
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither REPO_TOKEN nor GH_TOKEN secret is set in Aspose/aspose.org-workflows. Add one under Settings -> Secrets -> Actions."
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! WHOAMI=$(gh api user --jq .login 2>&1); then
            echo "::error::GitHub token (REPO_TOKEN/GH_TOKEN) is set but rejected by the GitHub API -- almost certainly expired or revoked. Real error: $WHOAMI"
            echo "reason=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Token OK -- authenticated as $WHOAMI"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: scripts/arbiter/data/state.json
          key: arbiter-seo-state-${{ github.ref_name }}
          restore-keys: |
            arbiter-seo-state-

      - name: Run arbiter
        run: python -m src.main -p aspose-org -n ${{ inputs.max_prs }}

      - name: Open or update a tracking issue if this run failed
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh label create seo-review-failure --repo Aspose/aspose.org-workflows \
            --color d73a4a --description "seo-review.yml run failed" 2>/dev/null || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON="${{ steps.token_check.outputs.reason || 'see run log' }}"
          BODY=$(cat <<EOF
          Run failed: $RUN_URL
          Trigger: ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Likely cause: $REASON (token_check step outcome; if this ran before the token check even executed, check the run log directly -- could be an arbiter/LLM-endpoint error instead).
          EOF
          )

          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label seo-review-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows --body "$BODY"
          else
            gh issue create --repo Aspose/aspose.org-workflows \
              --title "seo-review.yml is failing" \
              --label seo-review-failure \
              --body "$BODY"
          fi

      - name: Close the failure-tracking issue if this run succeeded
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label seo-review-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows \
              --body "Resolved -- this run (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) completed successfully."
            gh issue close "$EXISTING" --repo Aspose/aspose.org-workflows
          fi
