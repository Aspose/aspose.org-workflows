# seo-keyword-refresh.yml
#
# LOCATION: Aspose/aspose.org-workflows  (NOT in Aspose/aspose.org)
#
# This workflow must live in the public aspose.org-workflows repo alongside
# seo-analysis.yml and seo-apply.yml. It checks out the private Aspose/aspose.org
# repo at runtime using GH_TOKEN, runs the keyword generation scripts, and opens a
# pull request back on Aspose/aspose.org if any keyword files changed -- auto-merging
# it if (and only if) 4 automated safety gates all pass (see the "Check auto-merge
# safety gates" step below); otherwise the PR is left open for human review, exactly
# as before this workflow could auto-merge anything.
#
# Runs WEEKLY (not monthly -- SEO-SCHEMA-A-WORKFLOW-UPDATE). Change-detection
# (get_keywords.py skips a page whose title hasn't changed since it was last
# covered) keeps routine weekly cost small and proportional to real content
# churn, not total corpus size -- see get_keywords.py's own docstring on
# process_markdown_files_by_families for the skip-if-unchanged / --force /
# --max-calls design.
#
# AUTOMATIC PLATFORM-LABEL MIGRATION (Migration Plan v2): the original
# SEO-SCHEMA-A-BOOTSTRAP-REGENERATION dataset (896 entries, 12 families) was
# generated before per-file platform detection existed, so most non-.NET
# entries are mislabeled (Finding #50). Change-detection alone would skip
# these forever (their titles haven't changed). Rather than requiring a
# human to remember a one-off --force dispatch (Finding #52 found that path
# didn't even work -- it unioned instead of replacing keywords), the
# "Run automatic platform-label migration" step below runs on every
# scheduled invocation, tracks its own resumable progress in the committed
# data/seo_schema_a_migration_state.json, spends a bounded slice of each
# run's budget (migration_max_calls) correcting the next pending files, and
# self-disables (a cheap no-op) once every target family is fully corrected.
# No operator action is needed at any point.
#
# Required secrets (set in Aspose/aspose.org-workflows):
#   GOOGLE_API_KEY  - Gemini API key for get_keywords.py
#   REPO_TOKEN      - PAT with repo (full) scope on Aspose/aspose.org -- PRIMARY.
#   GH_TOKEN        - same-shaped PAT, used only as a fallback if REPO_TOKEN is unset.
#                     Real incident, 2026-08-09 to 2026-08-23: GH_TOKEN (last rotated
#                     2026-03-23) silently expired. Every token reference here used to
#                     read `secrets.GH_TOKEN || secrets.REPO_TOKEN` -- GH_TOKEN-primary.
#                     GitHub Actions' `||` only falls through on an EMPTY secret, not an
#                     invalid/expired one, so an expired-but-still-set GH_TOKEN silently
#                     wins every time and REPO_TOKEN, however fresh, was never reachable.
#                     Result: 3 consecutive weekly runs failed at the first real step
#                     (Checkout) with "Bad credentials", and nothing surfaced it -- no
#                     notification existed, so it went unnoticed for 3 weeks. Fixed
#                     2026-08-26: every token reference below now reads
#                     `secrets.REPO_TOKEN || secrets.GH_TOKEN` (REPO_TOKEN primary), and
#                     an explicit pre-flight token check + failure-notification step
#                     (below) make a future credential failure loud, not silent.
#
# To trigger manually:
#   Aspose/aspose.org-workflows -> Actions -> SEO Schema A Keyword Refresh -> Run workflow

name: SEO Schema A Keyword Refresh

# Prevents two runs (e.g. a manual workflow_dispatch overlapping the weekly
# schedule) from hammering the same free-tier Gemini key concurrently, which
# would multiply 429 pressure and could race on the `git push` in the "Open
# PR" step (both trying to push a branch for the same day). A single fixed
# group (not per-ref) is correct here: this workflow is a singleton job, not
# a per-branch/per-PR one. cancel-in-progress stays false -- an in-progress
# run has already spent real API quota; queue behind it rather than cancel
# and waste that.
concurrency:
  group: seo-keyword-refresh
  cancel-in-progress: false

on:
  schedule:
    # Every Sunday at 07:00 UTC (one hour after gsc-query-collector).
    # SEO-SCHEMA-A-WORKFLOW-UPDATE: changed from monthly ('0 7 1 * *') to
    # weekly. A single restricted field (day-of-week only, day-of-month left
    # '*') has no OR-ambiguity risk -- unlike the original '0 7 1-7 * 0' bug
    # (fixed 2026-07-30) where restricting BOTH day-of-month and day-of-week
    # fired on either match under cron/GitHub-Actions OR-semantics (~11
    # runs/month instead of the intended 1).
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      families:
        description: >
          Space-separated list of families to refresh.
          Leave blank to refresh all families from data/family_descriptions.json
          (dynamic -- do not hardcode a count here; it changes as families launch).
        required: false
        default: ''
      content_sites:
        description: >
          Comma-separated content directories to scan (relative to repo root).
          Default scans kb, docs, and products.
        required: false
        # Fixed 2026-07-30: kb.aspose.org's real content lives under content/kb.aspose.org/en/,
        # identical to docs and products -- the prior default omitted /en/ for kb specifically,
        # so every run (scheduled or manual, since this default is also the fallback in the
        # "Refresh keywords" step below) silently processed 0 kb.aspose.org files for every
        # family, with no error (get_keywords.py just logs "directory does not exist" and moves
        # on). Found while running SEO-SCHEMA-A-BOOTSTRAP-REGENERATION locally against this same
        # default -- confirmed via real content/kb.aspose.org/en/{family}/ directories existing
        # for every family tested.
        default: 'content/kb.aspose.org/en,content/docs.aspose.org/en,content/products.aspose.org/en'
      force_refresh:
        description: >
          Bypass skip-if-unchanged and force a fresh Gemini call for every page in scope,
          even if its title hasn't changed since last covered (replaces, not unions, that
          page's keywords -- Finding #52). For ad hoc whole-family re-generation only; the
          896-entry platform-mislabeling correction is now handled automatically by the
          "Run automatic platform-label migration" step below, not this flag.
        required: false
        default: false
        type: boolean
      max_calls:
        description: >
          Total Gemini call budget for routine refresh this run, split evenly across the
          content sites scanned. Default keeps a single run well under the empirically-observed
          ~350-400 call exhaustion ceiling found while running SEO-SCHEMA-A-BOOTSTRAP-REGENERATION.
          Separate from migration_max_calls below.
        required: false
        default: '250'
      run_migration:
        description: >
          Run the automatic platform-label migration step this run. Defaults on; disable for
          one run if needed (e.g. mid quota-crisis) without touching the scheduled trigger,
          which always runs it.
        required: false
        default: true
        type: boolean
      migration_max_calls:
        description: >
          Gemini call budget the migration step may spend this run, separate from and prior
          to max_calls above -- guarantees routine refresh always has at least
          (max_calls - migration_max_calls) calls of headroom even in a worst-case week.
          At the default 150/week, the 896-entry correction completes in ~6 weeks.
        required: false
        default: '150'

jobs:
  refresh-keywords:
    name: Refresh Schema A keywords
    runs-on: ubuntu-latest
    # Free-tier Gemini API: as low as 15 RPM. get_keywords.py and
    # migrate_platform_labels.py both pace every call at 4.5s and bound
    # 429-retry (5 attempts, exponential backoff) -- see
    # SEO-SCHEMA-A-GEMINI-LIMITS-HARDENING. migration_max_calls + max_calls
    # (defaults 150 + 250 = 400) is now the PRIMARY quota control for a
    # single run; this timeout is a backstop, not the main budget mechanism.
    # Routine refresh should make very few calls most weeks (change-detection
    # skips pages whose title hasn't changed) -- the migration step is the
    # one that will actually approach its budget until it self-completes.
    timeout-minutes: 90

    steps:
      - name: Verify GitHub token is valid
        # Runs BEFORE checkout, deliberately: actions/checkout@v4 retries 3x on auth
        # failure before giving up, burning ~25s to produce a generic "Bad credentials"
        # buried in raw logs -- exactly what let the 2026-08-09/16/23 failures go
        # unnoticed for 3 weeks (nothing about that failure mode was loud). This step
        # fails fast, with an explicit ::error:: annotation naming the real cause, and
        # sets an output every later step (including the failure-notification step)
        # can check without re-deriving it.
        id: token_check
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither REPO_TOKEN nor GH_TOKEN secret is set in Aspose/aspose.org-workflows. Add one under Settings -> Secrets -> Actions."
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! WHOAMI=$(gh api user --jq .login 2>&1); then
            echo "::error::GitHub token (REPO_TOKEN/GH_TOKEN) is set but rejected by the GitHub API -- almost certainly expired or revoked. Real error: $WHOAMI"
            echo "reason=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Token OK -- authenticated as $WHOAMI"

      - name: Checkout Aspose/aspose.org
        uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.org
          token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml google-generativeai

      - name: Determine families argument
        id: families
        # Hardened 2026-07-30: gate on github.event_name explicitly rather than
        # testing `github.event.inputs.families` alone. `inputs` does not exist
        # at all on a `schedule` trigger, and get_keywords.py's --families uses
        # argparse nargs="+" (requires >=1 value) -- a rendered "--families "
        # with nothing following it would fail argument parsing before any
        # Gemini call, and the next step's `|| echo WARNING ...` would swallow
        # that failure as a non-fatal warning, silently no-op-ing the run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.families }}" ]; then
            echo "args=--families ${{ github.event.inputs.families }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine content sites
        id: sites
        run: |
          echo "sites=${{ github.event.inputs.content_sites || 'content/kb.aspose.org/en,content/docs.aspose.org/en,content/products.aspose.org/en' }}" >> "$GITHUB_OUTPUT"

      - name: Run automatic platform-label migration
        if: github.event_name == 'schedule' || github.event.inputs.run_migration != 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY secret is not set. Add it under Aspose/aspose.org-workflows Settings -> Secrets -> Actions." >&2
            exit 1
          fi
          MIGRATION_MAX_CALLS="${{ github.event.inputs.migration_max_calls || '150' }}"
          python scripts/seo/migrate_platform_labels.py keywords/ \
            --content-sites "${{ steps.sites.outputs.sites }}" \
            --max-calls "$MIGRATION_MAX_CALLS" \
            || echo "WARNING: platform-label migration exited non-zero (likely a circuit-breaker trip -- real quota exhaustion is expected and recurring, not a bug; progress up to the trip was still saved). Continuing to routine refresh."

      - name: Refresh keywords for all content sites
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY secret is not set. Add it under Aspose/aspose.org-workflows Settings -> Secrets -> Actions." >&2
            exit 1
          fi
          SITES="${{ steps.sites.outputs.sites }}"
          IFS=',' read -ra SITE_ARRAY <<< "$SITES"

          MAX_CALLS_TOTAL="${{ github.event.inputs.max_calls || '250' }}"
          NUM_SITES=${#SITE_ARRAY[@]}
          PER_SITE_BUDGET=$((MAX_CALLS_TOTAL / NUM_SITES))
          if [ "$PER_SITE_BUDGET" -lt 1 ]; then PER_SITE_BUDGET=1; fi

          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Rotate family processing order by ISO week so a fixed per-run
            # budget doesn't always prioritize the same early families over
            # many weekly runs. Not applied to manual/migration dispatches,
            # where an operator-specified --families order should be honored
            # as given.
            EXTRA_ARGS="$EXTRA_ARGS --rotate-weekly"
          fi

          for site in "${SITE_ARRAY[@]}"; do
            echo "=== Processing: $site (per-site call budget: $PER_SITE_BUDGET) ==="
            python scripts/seo/get_keywords.py "$site" keywords/ ${{ steps.families.outputs.args }} \
              --max-calls "$PER_SITE_BUDGET" $EXTRA_ARGS \
              || echo "WARNING: $site exited non-zero (likely missing family sub-directories - non-fatal)"
          done

      - name: Run validation to confirm schema integrity
        run: python scripts/seo/pipeline/validate.py

      - name: Summarize changes
        id: summary
        run: |
          # git status --porcelain (not git diff --name-only): the migration
          # state file may not exist yet on its very first run -- a brand new
          # untracked file is invisible to `git diff` entirely, but shows up
          # correctly (as `??`) in `git status --porcelain`. Using diff here
          # would silently drop the state file's first-ever creation from both
          # this count and the PR, breaking migration persistence from run one.
          CHANGED=$(git status --porcelain -- keywords/ data/seo_schema_a_migration_state.json | wc -l | tr -d ' ')
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "### Keyword Refresh Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed files: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain -- keywords/ data/seo_schema_a_migration_state.json >> "$GITHUB_STEP_SUMMARY" || true
          git diff --stat -- keywords/ >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open PR on Aspose/aspose.org if keywords changed
        id: open_pr
        if: steps.summary.outputs.changed_files != '0'
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          BRANCH="seo/keyword-refresh-$(date +%Y%m%d)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Explicit paths (not a bare `git add -A`): stages the migration
          # state file even on its very first, currently-untracked creation,
          # while never risking staging anything outside this workflow's own
          # scope (matches check_merge_safety.py's Gate 2 exact-path allowlist).
          # Guarded on existence: the file won't be there yet if run_migration
          # was disabled for this run, and `git add` on a missing pathspec
          # would otherwise fail the whole step (bash steps run with -e).
          git add keywords/
          if [ -f data/seo_schema_a_migration_state.json ]; then
            git add data/seo_schema_a_migration_state.json
          fi
          git commit -m "chore(seo): refresh Schema A keywords [$(date +%Y-%m-%d)]"
          git push origin "$BRANCH"
          {
            echo "## Schema A Keyword Refresh"
            echo ""
            echo "Automated weekly refresh of LLM-derived Schema A keyword sets."
            echo ""
            echo "**Changes:**"
            echo "- Updated \`keywords/{family}.json\` files"
            echo "- Updated \`data/seo_schema_a_migration_state.json\` if the platform-label migration step made progress this run"
            echo "- Scanned \`content/kb.aspose.org\`, \`content/docs.aspose.org/en\`, \`content/products.aspose.org/en\`"
            echo "- Validation passed (\`validate.py\` exit 0)"
            echo ""
            echo "**Auto-merge policy:** this is a scoped, operator-authorized exception to this"
            echo "project's general human-merge-only rule for external PRs, limited to Schema A"
            echo "keyword data. This PR auto-merges only if ALL of the following automated gates"
            echo "pass; otherwise it is left open for human review, same as before this exception:"
            echo "- Diff scoped exclusively to \`keywords/*.json\` and/or \`data/seo_schema_a_migration_state.json\` (no other path changed)"
            echo "- Every changed entry has only \`pageTitle\`/\`sourcePath\`/\`keywords\` keys"
            echo "- No family's entry count decreased vs the base commit"
            echo ""
            echo "**Next step after merge:** Re-run \`seo-analysis.yml\` to pick up the refreshed keyword signals."
            echo ""
            echo "---"
            echo "Generated by \`seo-keyword-refresh.yml\` in Aspose/aspose.org-workflows"
          } > /tmp/pr-body.md
          gh pr create \
            --repo Aspose/aspose.org \
            --title "chore(seo): Schema A keyword refresh [$(date +%Y-%m-%d)]" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
          PR_NUMBER=$(gh pr view "$BRANCH" --repo Aspose/aspose.org --json number -q .number)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check auto-merge safety gates
        id: gates
        if: steps.summary.outputs.changed_files != '0'
        run: |
          if python scripts/seo/pipeline/check_merge_safety.py --base-ref "${{ steps.open_pr.outputs.base_sha }}"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge PR if all safety gates passed
        if: steps.summary.outputs.changed_files != '0' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh pr merge "${{ steps.open_pr.outputs.pr_number }}" --repo Aspose/aspose.org --squash --delete-branch
          echo "Auto-merged PR #${{ steps.open_pr.outputs.pr_number }} -- all safety gates passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Leave PR open for human review if any safety gate failed
        if: steps.summary.outputs.changed_files != '0' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh pr comment "${{ steps.open_pr.outputs.pr_number }}" --repo Aspose/aspose.org \
            --body "One or more auto-merge safety gates FAILED -- left open for human review. See the \`Check auto-merge safety gates\` step in this workflow run's log for exactly which gate(s) failed."
          echo "One or more auto-merge safety gates FAILED -- PR left open for human review." >> "$GITHUB_STEP_SUMMARY"

      - name: Skip PR - no keyword changes
        if: steps.summary.outputs.changed_files == '0'
        run: echo "No keyword files changed; skipping PR creation."

      - name: Open or update a tracking issue if this run failed
        # `if: failure()` runs this regardless of WHICH earlier step failed --
        # token check, checkout, a Gemini/API error, anything. This is the fix
        # for "most importantly, make it throw an error instead of silently
        # failing" (2026-08-26): before this step existed, the 2026-08-09/16/23
        # credential failures produced only a red X in the Actions tab -- no
        # proactive signal anywhere, which is exactly how they went unnoticed
        # for 3 weeks. One open issue is kept and commented on for repeat
        # failures (never a new issue per failed week) so this can't itself
        # become a source of weekly notification spam.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh label create seo-keyword-refresh-failure --repo Aspose/aspose.org-workflows \
            --color d73a4a --description "seo-keyword-refresh.yml run failed" 2>/dev/null || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON="${{ steps.token_check.outputs.reason || 'see run log' }}"
          BODY=$(cat <<EOF
          Run failed: $RUN_URL
          Trigger: ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Likely cause: $REASON (token_check step outcome; if this ran before the token check even executed, check the run log directly -- could be a Gemini/API error instead).
          EOF
          )

          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label seo-keyword-refresh-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows --body "$BODY"
          else
            gh issue create --repo Aspose/aspose.org-workflows \
              --title "seo-keyword-refresh.yml is failing" \
              --label seo-keyword-refresh-failure \
              --body "$BODY"
          fi

      - name: Close the failure-tracking issue if this run succeeded
        # Symmetry with the step above: a fixed run should say so, not leave a
        # stale "still failing" issue open once the real problem is resolved.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label seo-keyword-refresh-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows \
              --body "Resolved -- this run (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) completed successfully."
            gh issue close "$EXISTING" --repo Aspose/aspose.org-workflows
          fi
