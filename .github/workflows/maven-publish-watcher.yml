# maven-publish-watcher.yml
#
# LOCATION: Aspose/aspose.org-workflows  (NOT in Aspose/aspose.org)
#
# MT069-2026-09-16-GHA-MINUTES-REARCHITECTURE, PHB-06 (2026-09-17): fourth
# live migration under this mission's public-repo migration track, and the
# first of 4 requiring a real behavior change: the private original
# auto-commits detected registry changes directly via git_plumb_commit.py.
# The proven public-migration pattern never auto-commits -- per explicit
# user decision (2026-09-17), this migrated copy opens a PR instead
# (peter-evans/create-pull-request@v6, the same action seo-apply.yml already
# uses for cross-repo writes) and a human reviews/merges it. Detection and
# safety logic (publish_watcher.py's schema validation, atomic write,
# never-auto-flip-published-back-to-false) are UNCHANGED -- only how the
# result reaches the repo changed (PR instead of direct commit).
#
# IMPORTANT (human-authority boundary, inherited repo-wide norm, MT062/MT066):
# this workflow (and no automated process) may ever merge the PR it opens.
#
# Required secrets (set in Aspose/aspose.org-workflows, same ones the SEO
# templates and the other migrated bots already use -- not new exposure):
#   REPO_TOKEN   - PAT with repo (full) scope on Aspose/aspose.org -- PRIMARY.
#   GH_TOKEN     - same-shaped PAT, used only as a fallback if REPO_TOKEN is unset.

name: Maven Publish Watcher

on:
  schedule:
    - cron: '0 9 * * *'  # daily 09:00 UTC -- matches the private original's cadence
  workflow_dispatch: {}

jobs:
  check-publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify GitHub token is valid
        id: token_check
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither REPO_TOKEN nor GH_TOKEN secret is set in Aspose/aspose.org-workflows. Add one under Settings -> Secrets -> Actions."
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! WHOAMI=$(gh api user --jq .login 2>&1); then
            echo "::error::GitHub token (REPO_TOKEN/GH_TOKEN) is set but rejected by the GitHub API -- almost certainly expired or revoked. Real error: $WHOAMI"
            echo "reason=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Token OK -- authenticated as $WHOAMI"

      - uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.org
          token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up venv
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Check for newly-published or version-updated Java-FOSS packages
        id: watch
        run: |
          PYTHONPATH=scripts/pipeline python -m commands.ops.publish_watcher \
            --auto-apply \
            --issue-body-out /tmp/issue-body.md \
            --version-issue-body-out /tmp/version-issue-body.md
        continue-on-error: true

      - name: Open a PR with the auto-applied registry changes (instead of committing directly)
        if: steps.watch.outputs.wrote_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
          title: 'chore(package-registry): automated Maven publish-state update [migrated public execution]'
          body: |
            ## Automated Maven Publish-State Update

            Detected and applied by `publish_watcher.py --auto-apply` (schema-validated,
            atomic write, circuit-breaker-bounded -- see the script's own safety
            discipline, unchanged by this migration).

            Generated by `maven-publish-watcher.yml` running in
            `Aspose/aspose.org-workflows` (migrated public execution -- MT069 PHB-06).
            This workflow never merges its own PR -- a human review is required.
          branch: automated/maven-publish-watcher-update
          commit-message: 'chore(package-registry): automated Maven publish-state update'
          add-paths: data/package_registry.json

      - name: Create issue on new publish detected (on the private Aspose/aspose.org repo)
        if: steps.watch.outcome == 'failure' && hashFiles('/tmp/issue-body.md') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            const body = fs.readFileSync('/tmp/issue-body.md', 'utf8');
            await github.rest.issues.create({
              owner: 'Aspose',
              repo: 'aspose.org',
              title: `Java-FOSS package(s) now live on Maven Central — ${today}`,
              body: body + `\n\nTriggered by: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) (Aspose/aspose.org-workflows, migrated public execution -- MT069 PHB-06).`,
              labels: ['maven-publish-watcher'],
            });

      - name: Create issue on newer version detected (steady-state) (on the private Aspose/aspose.org repo)
        if: steps.watch.outcome == 'failure' && hashFiles('/tmp/version-issue-body.md') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            const body = fs.readFileSync('/tmp/version-issue-body.md', 'utf8');
            await github.rest.issues.create({
              owner: 'Aspose',
              repo: 'aspose.org',
              title: `Java-FOSS package(s) have a newer version on Maven Central — ${today}`,
              body: body + `\n\nTriggered by: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) (Aspose/aspose.org-workflows, migrated public execution -- MT069 PHB-06).`,
              labels: ['maven-publish-watcher'],
            });

      - name: Open or update a tracking issue if this run itself failed (on this repo, matching SEO-template convention)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh label create maven-publish-watcher-failure --repo Aspose/aspose.org-workflows \
            --color d73a4a --description "maven-publish-watcher.yml run failed" 2>/dev/null || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON="${{ steps.token_check.outputs.reason || 'see run log' }}"
          BODY=$(cat <<EOF
          Run failed: $RUN_URL
          Trigger: ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Likely cause: $REASON
          EOF
          )
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label maven-publish-watcher-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows --body "$BODY"
          else
            gh issue create --repo Aspose/aspose.org-workflows \
              --title "maven-publish-watcher.yml is failing" \
              --label maven-publish-watcher-failure \
              --body "$BODY"
          fi

      - name: Close the failure-tracking issue if this run succeeded
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label maven-publish-watcher-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows \
              --body "Resolved -- this run (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) completed successfully."
            gh issue close "$EXISTING" --repo Aspose/aspose.org-workflows
          fi
