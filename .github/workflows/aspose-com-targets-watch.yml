# aspose-com-targets-watch.yml
#
# LOCATION: Aspose/aspose.org-workflows  (NOT in Aspose/aspose.org)
#
# MT069-2026-09-16-GHA-MINUTES-REARCHITECTURE, PHB-05 (2026-09-17): this
# mission's designated canary migration. Migrated from the private original
# at Aspose/aspose.org's .github/workflows/aspose-com-targets-watch.yml
# (kept in place, flipped to workflow_dispatch-only -- not deleted, so
# rollback is a pure YAML revert with no data loss). Confirmed safe for
# public execution: reads only public aspose.com URLs and this repo's own
# data/aspose_com_targets.json; writes only an issue, and that issue is
# deliberately opened on the PRIVATE Aspose/aspose.org repo (not here) since
# it is a real content-drift finding a maintainer needs to act on there, not
# a report about this workflow's own health -- unlike this repo's SEO
# workflow siblings, whose failure-tracking issues correctly stay local to
# this repo. See analysis/threat_assessment.md (aspose-com-targets-watch.yml
# section) in the mission's evidence bundle for the full reasoning.
#
# Required secrets (set in Aspose/aspose.org-workflows, same ones the SEO
# templates already use -- not new exposure):
#   REPO_TOKEN   - PAT with repo (full) scope on Aspose/aspose.org -- PRIMARY.
#   GH_TOKEN     - same-shaped PAT, used only as a fallback if REPO_TOKEN is unset.

name: aspose.com Targets Watch (backlink registry drift detection)

on:
  schedule:
    - cron: '30 10 * * *'  # daily 10:30 UTC -- matches the private original's cadence
  workflow_dispatch: {}

jobs:
  check-target-map-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify GitHub token is valid
        # Same pre-flight pattern as the proven SEO templates (seo-apply.yml,
        # seo-keyword-refresh.yml, seo-review.yml) -- this repo has twice found
        # a GH_TOKEN-primary `||` ordering bug that let an expired fallback
        # token go undetected until a workflow was actually dispatched.
        id: token_check
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither REPO_TOKEN nor GH_TOKEN secret is set in Aspose/aspose.org-workflows. Add one under Settings -> Secrets -> Actions."
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! WHOAMI=$(gh api user --jq .login 2>&1); then
            echo "::error::GitHub token (REPO_TOKEN/GH_TOKEN) is set but rejected by the GitHub API -- almost certainly expired or revoked. Real error: $WHOAMI"
            echo "reason=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Token OK -- authenticated as $WHOAMI"

      - uses: actions/checkout@v4
        with:
          repository: Aspose/aspose.org
          token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/pipeline/requirements-ci.txt

      - name: Set up venv
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install -r scripts/pipeline/requirements-ci.txt --quiet

      - name: Check for confirmed status regressions
        id: watch
        run: |
          PYTHONPATH=scripts/pipeline python -m commands.ops.aspose_com_targets_watch --issue-body-out /tmp/issue-body.md
        continue-on-error: true

      - name: Check for registry staleness
        id: freshness
        run: |
          PYTHONPATH=scripts/pipeline python scripts/ci/checks/check_backlink_target_map_freshness.py
        continue-on-error: true

      - name: Create issue on confirmed regression or staleness (on the private Aspose/aspose.org repo)
        if: steps.watch.outcome == 'failure' || steps.freshness.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          # Explicit github-token override: the default `github.token` is scoped
          # only to THIS repo (aspose.org-workflows); this issue belongs on the
          # private content repo instead, so it needs the cross-repo token.
          github-token: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            let body = '';
            try {
              body = fs.readFileSync('/tmp/issue-body.md', 'utf8');
            } catch (e) {
              body = '## aspose.com Backlink Target Registry — Stale\n\n' +
                'No confirmed live-status regressions this run, but the registry ' +
                'freshness gate failed (see workflow log for the exact age). ' +
                'Run fetch_aspose_com_targets.py to refresh.\n';
            }
            // Explicit owner/repo (NOT context.repo, which would resolve to
            // aspose.org-workflows -- this issue must land on the private repo
            // where the actual content/backlink fix work happens).
            await github.rest.issues.create({
              owner: 'Aspose',
              repo: 'aspose.org',
              title: `aspose.com target registry drift/staleness — ${today}`,
              body: body + `\n\nTriggered by: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) (Aspose/aspose.org-workflows, migrated public execution -- MT069 PHB-05).`,
              labels: ['aspose-com-targets-watch'],
            });

      - name: Open or update a tracking issue if this run itself failed (on this repo, matching SEO-template convention)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          gh label create aspose-com-targets-watch-failure --repo Aspose/aspose.org-workflows \
            --color d73a4a --description "aspose-com-targets-watch.yml run failed" 2>/dev/null || true

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REASON="${{ steps.token_check.outputs.reason || 'see run log' }}"
          BODY=$(cat <<EOF
          Run failed: $RUN_URL
          Trigger: ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Likely cause: $REASON (token_check step outcome; if this ran before the token check even executed, check the run log directly).
          EOF
          )

          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label aspose-com-targets-watch-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows --body "$BODY"
          else
            gh issue create --repo Aspose/aspose.org-workflows \
              --title "aspose-com-targets-watch.yml is failing" \
              --label aspose-com-targets-watch-failure \
              --body "$BODY"
          fi

      - name: Close the failure-tracking issue if this run succeeded
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo Aspose/aspose.org-workflows --label aspose-com-targets-watch-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo Aspose/aspose.org-workflows \
              --body "Resolved -- this run (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) completed successfully."
            gh issue close "$EXISTING" --repo Aspose/aspose.org-workflows
          fi
