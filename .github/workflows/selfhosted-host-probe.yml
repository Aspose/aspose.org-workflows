# selfhosted-host-probe.yml
#
# LOCATION: Aspose/aspose.org-workflows  (NOT in Aspose/aspose.org)
#
# MT069-2026-09-16-GHA-MINUTES-REARCHITECTURE (2026-09-18), cards HC-03 / HC-06 /
# HC-11: a manual-only, read-only probe that runs DIRECTLY on the self-hosted
# runner host -- deliberately NOT in a container -- because that is how the two
# private jobs (content-governance-checks.yml, skill-governance.yml's Linux job)
# run on `alienware-m18-wsl2-private`. The test runner this targets
# (`alienware-m18-wsl2-test`) is the same machine, WSL distro and OS user, so its
# answers describe the private runner's environment. (Unlike the older
# selfhosted-runner-smoke-test.yml, which runs inside a fresh container and so
# says nothing about host exposure.)
#
# It answers three questions with saved evidence, without touching the private
# repo or any secret:
#   HC-03  Can job code reach the Windows drive / interop from here? Does anything
#          persist on the host between runs?
#   HC-06  Which tools does the host lack? Do actions/setup-python and
#          peaceiris/actions-hugo (the two the private job uses) work on it?
#   HC-11  Every "PROBE:" line is a machine-readable field the first-live-run
#          protocol's observation commands are checked against.
#
# workflow_dispatch only. No schedule, no secrets, contents:read.

name: Self-Hosted Host Probe

on:
  workflow_dispatch: {}

concurrency:
  group: selfhosted-host-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, gha-selfhosted-test]
    timeout-minutes: 10
    steps:
      - name: Identity (host-direct, no container)
        run: |
          echo "PROBE:runner_name=${RUNNER_NAME}"
          echo "PROBE:runner_os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          echo "PROBE:whoami=$(whoami) uid=$(id -u)"
          echo "PROBE:hostname=$(hostname)"
          echo "PROBE:workspace=${GITHUB_WORKSPACE}"
          echo "PROBE:in_container=$( [ -f /.dockerenv ] && echo yes || echo no )"

      - name: Windows drive and interop reachability (HC-03)
        run: |
          for p in /mnt/c /mnt/c/Windows/win.ini /mnt/c/Users; do
            if [ -e "$p" ] && [ -r "$p" ]; then echo "PROBE:reachable $p=yes"; else echo "PROBE:reachable $p=no"; fi
          done
          if [ -e /proc/sys/fs/binfmt_misc/WSLInterop ] || [ -e /proc/sys/fs/binfmt_misc/WSLInterop-late ]; then
            echo "PROBE:wsl_interop=enabled"
          else
            echo "PROBE:wsl_interop=disabled"
          fi
          echo "PROBE:npm_resolves_to=$(command -v npm || echo none)"
          echo "PROBE:docker_resolves_to=$(command -v docker || echo none)"

      - name: Cross-run persistence on the host (HC-03)
        run: |
          M="$HOME/.mt069_host_probe_marker"
          if [ -f "$M" ]; then
            echo "PROBE:marker_from_previous_run=yes contents=$(cat "$M")"
          else
            echo "PROBE:marker_from_previous_run=no"
          fi
          echo "run_id=${GITHUB_RUN_ID} at $(date -u +%FT%TZ)" > "$M"
          echo "PROBE:marker_written=${M}"

      - name: Tool inventory (HC-06)
        run: |
          for t in git curl wget tar gzip node npm docker go gofmt jq yq unzip zip make gcc shellcheck hugo; do
            printf 'PROBE:tool %s=%s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout worked with full history (HC-06)
        run: |
          echo "PROBE:checkout_head=$(git rev-parse HEAD)"
          echo "PROBE:checkout_commit_count=$(git rev-list --count HEAD)"
          echo "PROBE:checkout_is_shallow=$(git rev-parse --is-shallow-repository)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: setup-python worked (HC-06)
        run: |
          echo "PROBE:python_version=$(python --version 2>&1)"
          echo "PROBE:python_path=$(command -v python)"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: actions-hugo worked (HC-06)
        run: |
          echo "PROBE:hugo_version=$(hugo version 2>&1 | head -1)"

      - name: Done
        run: echo "PROBE:done=1"
